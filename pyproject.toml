[project]
name = "filedfor"
version = "0.1.0"
description = "New-grad tech jobs at companies with a record of H-1B sponsorship, with role-level evidence from DOL filings"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jawaad Jariwala", email = "jawaadjariwala1jan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastexcel>=0.21.0",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://jawaadjariwala.github.io/FiledFor/"
Repository = "https://github.com/jawaadjariwala/FiledFor"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
